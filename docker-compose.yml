services:
  # Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: legalai_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-api

  # Frontend Web UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legalai_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend-api:8000/api/v1
    depends_on:
      - backend-api

  # Backend REST API Service
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalai_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/legalai
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/legalai
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=legalai_secret_password
      - AI_SERVICE_URL=http://ai-service:8001
      - OCR_SERVICE_URL=http://ocr-service:8002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started

  # AI & RAG Inference Microservice
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: legalai_ai_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=legalai_secret_password

  # OCR Document Processing Microservice
  ocr-service:
    build:
      context: ./ocr_service
      dockerfile: Dockerfile
    container_name: legalai_ocr_service
    restart: always
    ports:
      - "8002:8002"

  # Async Celery Worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: legalai_worker
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  # PostgreSQL Relational & Metadata DB
  db:
    image: postgres:16-alpine
    container_name: legalai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legalai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: legalai_redis
    restart: always
    ports:
      - "6379:6379"

  # Qdrant Vector Search Engine
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: legalai_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Neo4j Knowledge Graph DB
  neo4j:
    image: neo4j:5.18.0-community
    container_name: legalai_neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/legalai_secret_password
    volumes:
      - neo4j_data:/data

  # Prometheus Telemetry Monitoring
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: legalai_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.3.3
    container_name: legalai_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata:
  qdrant_data:
  neo4j_data:
