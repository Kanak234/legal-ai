name: Repository Guard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify repository integrity
      run: |
        test -f README.md
        test -f docker-compose.yml
        test -f backend/run_local.py
        test -f tests/security_audit.py
        test -f tests/test_platform.py
        echo "Integrity check passed."
