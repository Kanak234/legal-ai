name: Docker & Microservices Build Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Service Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: legalai-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Microservice Container
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          push: false
          tags: legalai-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
