name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test runner dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi httpx uvicorn sqlalchemy pydantic pytest

    - name: Python syntax check
      run: |
        python -m compileall -q backend/ tests/ data_pipeline/

    - name: Run Security SAST Audit
      run: |
        python tests/security_audit.py

    - name: Run Direct Import Validation
      run: |
        python tests/test_direct_imports.py

    - name: Run Platform Test Suite
      run: |
        python -m unittest tests/test_platform.py
