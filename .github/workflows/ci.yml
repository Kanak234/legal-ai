name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install numpy aiosqlite email-validator pytest pytest-cov ruff

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Python syntax check (compileall)
        run: |
          python -m compileall -q backend/ tests/ data_pipeline/ ai_service/ ocr_service/ worker/ scripts/

      - name: Security SAST Audit
        run: |
          python tests/security_audit.py

      - name: Direct Import Validation
        run: |
          python tests/test_direct_imports.py

      - name: Standalone Platform Unit Tests
        run: |
          python -m unittest tests/test_platform.py

      - name: Standalone Run Tests Suite
        run: |
          python tests/run_tests.py

      - name: Pytest Suite with Coverage Enforcement
        run: |
          pytest -v --cov=backend/app --cov=ai_service/app --cov-report=term-missing --cov-report=xml --cov-fail-under=80 tests/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml
